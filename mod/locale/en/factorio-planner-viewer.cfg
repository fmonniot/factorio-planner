[mod-setting-name]
fp-viewer-bridge-port=Planner bridge port
fp-viewer-debug=Planner viewer: debug log

[mod-setting-description]
fp-viewer-bridge-port=The UDP port the planner's bridge listens on (its default is 34199). The game's own port is the one given to --enable-lua-udp.
fp-viewer-debug=Write how long each send_udp call takes to factorio-current.log.

[fp-viewer]
button=Plan
button-tooltip=Show the plan sent from the Factorio Planner
title=Factorio Planner
close=Close
no-plan=No plan received yet. Press Send in the planner.
no-blocks=The plan has no blocks.
data-set=Data set: __1__
unnamed=(unnamed block)

indicator-disconnected=[color=red]Disconnected[/color]: the planner's bridge has not been heard. Start the bridge, and launch Factorio with --enable-lua-udp __1__ (a Steam launch option or a shortcut). If it is running, look for "Address already in use" in factorio-current.log: another program holds that port.
indicator-mismatch=[color=red]Protocol mismatch[/color]: the bridge speaks another protocol version. Update the mod or the bridge so both come from the same release.
indicator-stale=[color=orange]Stale[/color]: the planner has a newer plan than the one shown. Press Send in the planner.

missing-heading=__1__ ids of this plan are not in this game (another mod set than the plan's?):
missing-id=[color=red]__1__ (not in this game)[/color]
electricity=Electricity
unknown-row=[color=orange]Unknown (__1__)[/color]
solve-failed=The planner could not solve this block: __1__

none=None
unnamed-group=(unnamed sub-factory)
area-tag=Area

tt-check-row=Built
tt-check-group=Built: every row of this sub-factory. Ticks or unticks them all.
tt-rate=__1__ per minute
tt-machines=__1__ machines
tt-beacons-per-machine=__1__ per machine
tt-beacons-total=__1__ in all
tt-module=__1__ × __2__
tt-click=Left click: put this building in the cursor

cannot-place=Cannot put this building in the cursor: __1__
refused-no-machine=the row has no building
refused-unknown-entity=this game does not have it
refused-not-blueprintable=it cannot go in a blueprint
refused-not-placeable=no item places it
refused-unknown-recipe=this game does not have the recipe
refused-unknown-module=this game does not have one of its modules
refused-no-module-inventory=it has modules but no known module slots
refused-too-many-modules=too many modules
refused-cursor-full=the cursor cannot be emptied (inventory full?)
refused-failed=something went wrong (see factorio-current.log)


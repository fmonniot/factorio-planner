name: Test

on:
  pull_request:
  # Also run on main so its caches (Playwright browsers, optimised icons) exist
  # for pull requests, which can only read caches from their base branch.
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip_build:
        description: Skip the build job (the caller builds the site itself)
        type: boolean
        default: false

jobs:
  check:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:docs
      - run: npm run test:unit

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Playwright cache key
        id: playwright
        run: |
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      # The browser download is cached. The system libraries it needs come from
      # apt, which is slow and sometimes takes minutes, so they are installed
      # only on a cache miss. The runner image version is in the key: a new
      # image misses the cache and gets its libraries installed again.
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

  build:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scripts/build-icons.mjs keeps optimised icons here by source hash.
      - uses: actions/cache@v6
        with:
          path: .cache/icons
          key: icons-${{ hashFiles('scripts/build-icons.mjs') }}-${{ hashFiles('public/data/**/*.png') }}
          restore-keys: icons-${{ hashFiles('scripts/build-icons.mjs') }}-
      - run: npm run build

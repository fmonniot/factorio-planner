name: Dependabot auto-merge

# Turns on auto-merge, squash method, for Dependabot pull requests. GitHub then merges the pull request
# by itself once every check that branch protection requires has passed; this workflow does not wait for CI.
# It needs two repository settings (see spec/tech-stack.md): "Allow auto-merge", and a rule on main that
# requires the CI checks. Without a required check, GitHub merges at once.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: enable auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

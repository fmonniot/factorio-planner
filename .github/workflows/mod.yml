name: Mod (Lua)

# The in-game viewer's mod logic: busted specs and luacheck under Lua 5.2,
# Factorio's version. mod/setup-lua.sh pins the toolchain and is the same script
# a developer runs locally. CI never runs Factorio.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua:
    name: busted + luacheck (Lua 5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        id: lua-tree
        with:
          path: mod/.lua
          key: lua-tree-${{ runner.os }}-${{ hashFiles('mod/setup-lua.sh') }}
      - name: Build the Lua toolchain
        if: steps.lua-tree.outputs.cache-hit != 'true'
        run: mod/setup-lua.sh
      - name: luacheck
        working-directory: mod
        run: .lua/bin/luacheck .
      - name: busted
        working-directory: mod
        run: .lua/bin/busted

  # The release workflow (release-viewer.yml) only runs when a release is published, so the packaging
  # script is exercised here: the zip must hold one <name>_<version>/ folder with a matching info.json.
  package:
    name: release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/package-viewer-mod.sh v9.9.9 "$RUNNER_TEMP/dist"
      - name: Check the layout
        run: |
          zip="$RUNNER_TEMP/dist/factorio-planner-viewer_9.9.9.zip"
          list="$(unzip -Z1 "$zip")"
          if grep -qv '^factorio-planner-viewer_9\.9\.9/' <<< "$list"; then echo "entry outside the one folder"; exit 1; fi
          unzip -p "$zip" factorio-planner-viewer_9.9.9/info.json | grep -q '"version": "9.9.9"'
          for f in info.json control.lua data.lua settings.lua graphics/button-x56.png lib/receiver.lua scripts/gui.lua locale/en/factorio-planner-viewer.cfg; do
            grep -qxF "factorio-planner-viewer_9.9.9/$f" <<< "$list" || { echo "missing $f"; exit 1; }
          done
          if grep -E '/(spec|tools)/|\.svg$' <<< "$list"; then echo "development file in the zip"; exit 1; fi

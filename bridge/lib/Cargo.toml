[package]
name = "bridge-lib"
description = "Wire protocol and session logic of the in-game viewer's bridge (planner to Factorio mod)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The planner-facing WebSocket: synchronous, no async runtime, no TLS (the endpoint is plain ws:// on loopback).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints.rust]
unsafe_code = "forbid"

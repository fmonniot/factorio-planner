[package]
name = "factorio-planner-desktop"
version = "0.1.0"
description = "Desktop wrapper for the Factorio Planner"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "factorio_planner_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
bridge-lib = { path = "../bridge/lib" }
serde_json = "1"
